aid: barogo
name: Barogo
description: >-
  Barogo (바로고) is a South Korean last-mile delivery platform founded in 2014 and headquartered
  in Gangnam-gu, Seoul. It operates a nationwide two-wheeler dispatch network for food and
  goods, with rider, merchant and hub-manager apps and a store POS program, and counts
  McDonald's, Burger King, KFC, Krispy Kreme, Baskin Robbins and Dunkin among its clients. Its
  developer-facing product is Gorela (고릴라), a delivery-brokerage platform that sits between an
  "order agency" — a POS, marketplace or commerce platform that takes the customer's order —
  and the delivery agencies that assign riders. The Gorela API covers fare quoting and
  serviceability, order intake in fixed-fare and flexible-fare modes, order read/amend/cancel,
  store mapping, prepaid store balances, delivery-agency status and delivery zones, plus twenty
  callbacks pushed back to the partner as an order fans out into its child deliveries.
