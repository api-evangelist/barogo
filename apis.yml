apis:
- aid: barogo-gorela-order-agency-api
  name: Gorela Order Agency API
  description: >-
    The Gorela (고릴라) order-agency API. An order agency quotes a delivery, accepts the order
    into Gorela, and Gorela brokers it out to one or more delivery agencies that dispatch
    riders. Order and delivery are separate aggregates — one order can fan out into N
    deliveries, and the order only closes once every child delivery is terminal. Two fare
    models are offered: 고정 요금 | 의무 수행, where Gorela sets the fare and takes responsibility
    for completion, and 유연 요금 | 자율 수행, where the partner sets the fare and riders opt in.
    Each is available address-based (no store setup) or store-based (requires a 1:1 store
    mapping). Twenty-one REST operations plus twenty callbacks, authenticated with a static
    API key as an HTTP bearer token.
  humanURL: https://developer.gorelas.com/api-doc/request
  baseURL: https://api-interlocker.gorelas.com
