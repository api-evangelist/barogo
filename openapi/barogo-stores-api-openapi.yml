  /api/stores:
    get:
      operationId: listStores
      summary: 상점 목록 조회
      description: '공식 문서: 상점 매핑'
      tags:
      - Stores
      x-evidence:
        method: derived-from-published-docs
        sources:
        - https://developer.gorelas.com/api-docs-md/request-12.md
        fetched: '2026-08-06'
      parameters:
      - name: businessNumber
        in: query
        required: true
        description: 사업자 등록 번호
        schema:
          type: string
          x-constraint: '10'
          description: 사업자 등록 번호
      - name: phone
        in: query
        required: false
        description: 상점 전화번호
        schema:
          type: string
          minLength: 8
          maxLength: 12
          description: 상점 전화번호
      responses:
        '200':
          description: 요청한 작업이 성공했을 때 응답됩니다.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
