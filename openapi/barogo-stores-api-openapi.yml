                                x-constraint: 1 <= 30
                                description: 상점 이름
                              phone:
                                type: string
                                x-constraint: 8 <= 12
                                description: 상점 전화번호
                              jibunAddress:
                                type: string
                                x-constraint: 1 <= 100
                                description: 상점 지번 주소
                              roadAddress:
                                type: string
                                x-constraint: 1 <= 100
                                description: 상점 도로명 주소
                              detailAddress:
                                type: string
                                x-constraint: 1 <= 100
                                description: 상점 상세 주소
                              businessNumber:
                                type: string
                                x-constraint: 1 <= 10
                                description: 사업자 등록 번호
                              createdAt:
                                type: integer
                                format: int64
                                description: 상점 생성 일시 (timestamp)
                            required:
                            - storeId
                            - name
                            - phone
                            - jibunAddress
                            - businessNumber
                            - createdAt
                            title: 상점 목록
                      required:
                      - isSuccess
                      title: 성공 응답 데이터
                  required:
                  - statusCode
                  - data
                  title: Response Data (SUCCESS)
                - type: object
                  properties:
                    statusCode:
                      type: integer
                    data:
                      type: object
                      properties:
                        isSuccess:
                          type: boolean
                          description: 성공 여부
                        reason:
                          type: string
                          description: 실패 사유
                          enum:
                          - OVER_LIMIT
                          - CLOSED_STORE
                          - NOT_FOUND_STORE
                          x-enum-descriptions:
                            OVER_LIMIT: 조회 결과 너무 많음 (10개 초과)
                            CLOSED_STORE: 종료된 상점
                            NOT_FOUND_STORE: 일치하는 상점 없음
                      required:
                      - isSuccess
                      - reason
                      title: 거절 응답 데이터
                  required:
                  - statusCode
                  - data
                  title: Response Data (REJECT)
                  description: 요청이 거절된 경우의 응답 데이터
