                      type: integer
                    data:
                      type: object
                      properties:
                        isSuccess:
                          type: boolean
                          description: 성공 여부
                        stores:
                          type: array
                          items:
                            type: object
                            properties:
                              storeId:
                                type: integer
                                description: 고릴라 상점 아이디
                              name:
