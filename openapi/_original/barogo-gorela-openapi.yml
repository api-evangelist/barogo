openapi: 3.1.0
info:
  title: Barogo Gorela Order Agency API
  version: '2026-06-23'
  summary: 고릴라(Gorela) 배달대행 중계 플랫폼 — 주문 제휴사(Order Agency) 연동 API
  description: 'Gorela is the delivery-brokerage platform operated by Barogo (바로고). It sits between an order agency (a POS,
    marketplace or commerce platform that takes the customer''s order) and the delivery agencies that dispatch riders. One
    order can fan out to N deliveries.


    This OpenAPI document was DERIVED by API Evangelist from Barogo''s own published developer reference at https://developer.gorelas.com/api-docs-md/
    (last updated 2026-06-23). Every path, method, parameter name, type, enum value and example is carried over verbatim from
    those documents. Barogo does not publish an OpenAPI document of its own; this is a faithful transcription, not a provider-published
    artifact.


    Auth: `Authorization: Bearer {API_Key}` — API keys are issued from the 연동 관리 (linkage) console at https://developer.gorelas.com/linkage
    after partner registration.'
  contact:
    name: Gorela TAM
    email: tech_poc@barogo.com
    url: https://developer.gorelas.com/
  x-origin:
  - format: markdown
    url: https://developer.gorelas.com/api-docs-md/index.md
    version: '2026-06-23'
    converter:
      url: https://apievangelist.com
      version: pipeline-enrich local-v1
servers:
- url: https://api-interlocker.gorelas.com
  description: 운영 (production)
- url: https://staging-api-interlocker.gorelas.com
  description: 테스트 (staging)
security:
- bearerAuth: []
tags:
- name: Orders
  description: 주문 접수 / 조회 / 수정 / 취소 및 배달 가능 여부·요금 조회
- name: Stores
  description: 상점 조회 및 주문 제휴사 ↔ 고릴라 상점 매핑
- name: Deposits
  description: 상점 예치금(Cash, Money) 잔액 조회
- name: Delivery
  description: 배달대행사 배달 수행 상태 조회
- name: Areas
  description: 상점 배달 권역 / 불가 구역 / 할증 구역 조회
paths:
  /api/delivery-conditions:
    get:
      operationId: getDeliveryAgencyConditions
      summary: 배달대행사 상태 조회
      description: '공식 문서: 배달대행사 상태 조회'
      tags:
      - Delivery
      x-evidence:
        method: derived-from-published-docs
        sources:
        - https://developer.gorelas.com/api-docs-md/request-10.md
        fetched: '2026-08-06'
      parameters:
      - name: orderAgencyId
        in: query
        required: true
        description: 주문 제휴사 아이디
        schema:
          type: string
          maxLength: 30
          description: 주문 제휴사 아이디
      - name: orderAgencyStoreId
        in: query
        required: true
        description: 주문 제휴사의 상점 아이디
        schema:
          type: string
          maxLength: 100
          description: 주문 제휴사의 상점 아이디
      responses:
        '200':
          description: 요청한 작업이 성공했을 때 응답됩니다.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    statusCode:
                      type: integer
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          deliveryAgencyId:
                            type: string
                            maxLength: 30
                            description: 배달대행사 아이디
                          deliveryAgencyName:
                            type: string
                            maxLength: 30
                            description: 배달대행사 이름
                          isDeliveryPossible:
                            type: boolean
                            description: 배달 가능 여부 *[배달 중단/해제](/api-doc/callback#배달_중단_/_해제) 콜백에 의해 변경(반영)되는 값입니다.*
                          delayTime:
                            type: integer
                            description: 배달 지연 시간 (분)
                          totalExtraCharge:
                            type: integer
                            description: 총 할증 금액
                          extraCharges:
                            type: array
                            items:
                              type: object
                              properties:
                                dataType:
                                  type: string
                                  description: 할증 데이터 종류
                                  enum:
                                  - FIXED
                                  - RATE
                                  - NONE
                                  x-enum-descriptions:
                                    FIXED: 정액 타입 할증(원)
                                    RATE: 정률 타입 할증(%)
                                    NONE: 금액을 특정할 수 없는 타입의 할증
                                type:
                                  type: string
                                  description: 할증 종류
                                  enum:
                                  - WEATHER
                                  - AREA
                                  - HOLIDAY
                                  - TIME
                                  - BUSY
                                  - LATE_NIGHT
                                  - VALUABLE
                                  - ETC
                                  x-enum-descriptions:
                                    WEATHER: 기상
                                    AREA: 구역
                                    HOLIDAY: 휴일
                                    TIME: 시간)
                                    BUSY: 배달 폭증
                                    LATE_NIGHT: 심야
                                    VALUABLE: 귀중
                                    ETC: 기타
                                charge:
                                  type: integer
                                  description: 할증 금액 또는 할증률 할증 목록
                              required:
                              - dataType
                              - type
                              - charge
                              title: 할증 데이터
                          pickupMinimumAt:
                            type: integer
                            description: 픽업 최소 일시 (timestamp)
                        required:
                        - deliveryAgencyId
                        - deliveryAgencyName
                        - isDeliveryPossible
                        - delayTime
                        - totalExtraCharge
                        - pickupMinimumAt
                        title: 성공 응답 데이터
                  required:
                  - statusCode
                  - data
                  title: Response Data (SUCCESS)
                - type: object
                  properties:
                    statusCode:
                      type: integer
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          deliveryAgencyId:
                            type: string
                            maxLength: 30
                            description: 배달대행사 아이디
                          deliveryAgencyName:
                            type: string
                            maxLength: 30
                            description: 배달대행사 이름
                          isDeliveryPossible:
                            type: boolean
                            description: 배달 가능 여부 *[배달 중단/해제](/api-doc/callback#배달_중단_/_해제) 콜백에 의해 변경(반영)되는 값입니다.*
                          reason:
                            type: string
                            description: 배달 불가능 상태 유형
                            enum:
                            - OVER_CAPACITY
                            - BAD_WEATHER
                            - CLOSE_AGENCY
                            - CLOSE_STORE
                            - ETC
                            x-enum-descriptions:
                              OVER_CAPACITY: 배달을 수행할 수 있는 라이더가 부족하여 배달이 거절된 경우
                              BAD_WEATHER: 배달 불가능한 날씨로 인해 배달이 거절된 경우
                              CLOSE_AGENCY: 배달대행사의 영업이 종료되어 배달이 거절된 경우
                              CLOSE_STORE: 상점의 영업이 종료되어 배달이 거절된 경우
                              ETC: 기타 사유로 인해 요청이 거절된 경우
                        required:
                        - deliveryAgencyId
                        - deliveryAgencyName
                        - isDeliveryPossible
                        - reason
                        title: 거절 응답 데이터
                  required:
                  - statusCode
                  - data
                  title: Response Data (REJECT)
                  description: 요청이 거절된 경우의 응답 데이터
                - type: object
                  properties:
                    statusCode:
                      type: integer
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          category:
                            type: string
                            description: 에러 카테고리
                          errorCode:
                            type: string
                            description: 에러 코드
                          message:
                            type: string
                            description: 에러 메시지
                          info:
                            type: array
                            items:
                              type: object
                              properties:
                                deliveryAgencyId:
                                  type: string
                                  maxLength: 30
                                  description: 배달대행사 아이디
                                deliveryAgencyName:
                                  type: string
                                  maxLength: 30
                                  description: 배달대행사 이름 해당 배달대행사 정보
                              required:
                              - deliveryAgencyId
                              - deliveryAgencyName
                              title: 베달대행사 데이터
                        required:
                        - category
                        - errorCode
                        - message
                        title: 에러 응답 데이터
                  required:
                  - statusCode
                  - data
                  title: Response Data (ERROR)
                  description: 부분 실패(207) 등에서 함께 전달되는 에러 데이터
              examples:
                배달이 가능한 상태:
                  value:
                    statusCode: 200
                    data:
                    - deliveryAgencyId: barogo
                      deliveryAgencyName: 바로고
                      isDeliveryPossible: true
                      delayTime: 10
                      totalExtraCharge: 500
                      extraCharges:
                      - dataType: FIXED
                        type: HOLIDAY
                        status: 'ON'
                        charge: 500
                      - dataType: NONE
                        type: WEATHER
                        status: 'ON'
                        charge: null
                      pickupMinimumAt: 1674742904640
                배달이 불가능한 상태:
                  value:
                    statusCode: 200
                    data:
                    - deliveryAgencyId: barogo
                      deliveryAgencyName: 바로고
                      isDeliveryPossible: false
                      reason: BAD_WEATHER
                일부 성공 (207):
                  value:
                    statusCode: 207
                    data:
                    - deliveryAgencyId: barogo
                      deliveryAgencyName: 바로고
                      isDeliveryPossible: true
                      delayTime: 10
                      totalExtraCharge: 500
                      extraCharges:
                      - dataType: FIXED
                        type: WEATHER
                        charge: 500
                      pickupMinimumAt: 1674742904640
                    errors:
                    - category: BAD_GATEWAY
                      errorCode: EXTERNAL_SERVER_ERROR
                      message: '[moacall] fail request delivery agency service'
                      info:
                        deliveryAgencyId: moacall
                        deliveryAgencyName: 모아콜
        '400':
          description: BAD_REQUEST — SCHEMA_VALIDATE / NOT_ALLOW / REQUEST_JSON_PARSING / INVALID_INPUT / NONE_DELIVERY_AGENCY_MAPPING
            / NONE_ORDER_AGENCY_MAPPING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHORIZED — EXPIRED_API_KEY / VERIFY_API_KEY_FAIL / ROLE_DENY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NOT_FOUND — NOT_FOUND_API / NOT_FOUND_RESOURCE / EXTERNAL_NOT_FOUND_RESOURCE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: CONFLICT — DUPLICATED_ID / DUPLICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: TOO_MANY_REQUESTS — API 요청 횟수 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_SERVER_ERROR — DB_FAIL / JSON_PARSING / SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: BAD_GATEWAY — EXTERNAL_SERVER_ERROR / NOT_ALLOW_EXTERNAL / MAINTENANCE_TIME
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE — SERVICE_UNAVAILABLE / EXTERNAL_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: GATEWAY_TIMEOUT — GATEWAY_TIMEOUT / EXTERNAL_SERVER_TIMEOUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/delivery-possible:
    post:
      operationId: checkDeliveryPossible
      summary: 배달 가능 여부 및 요금 조회
      description: '공식 문서: 고정 요금 | 의무 수행 (상점 기반), 고정 요금 | 의무 수행 (주소 기반)'
      tags:
      - Orders
      x-evidence:
        method: derived-from-published-docs
        sources:
        - https://developer.gorelas.com/api-docs-md/request-1.md
        - https://developer.gorelas.com/api-docs-md/request-2.md
        fetched: '2026-08-06'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  orderAgencyId:
                    type: string
                    maxLength: 30
                    description: 주문 제휴사 아이디
                  pickupId:
                    type: string
                    maxLength: 100
                    description: 픽업지 식별 아이디 (상점 아이디 등, 없다면 빈값 가능)
                  pickupRoadAddress:
                    type: string
                    maxLength: 100
                    description: '픽업 도로명 주소 ****필수**: pickupJibunAddress 또는 pickupRoadAddress*'
                  pickupJibunAddress:
                    type: string
                    maxLength: 100
                    description: '픽업 지번 주소 (`법정동`) ****필수**: pickupJibunAddress 또는 pickupRoadAddress*'
                  pickupAddressDetail:
                    type: string
                    maxLength: 100
                    description: 픽업 상세 주소
                  pickupLocation:
                    type: object
                    properties:
                      latitude:
                        type: string
                        description: 위도
                      longitude:
                        type: string
                        description: 경도 픽업지 좌표 **좌표가 있는 경우, 주소보다 **좌표를 우선 처리**합니다.*
                    required:
                    - latitude
                    title: 좌표 데이터
                  dropRoadAddress:
                    type: string
                    maxLength: 100
                    description: '드랍 도로명 주소 ****필수**: dropJibunAddress 또는 dropRoadAddress*'
                  dropJibunAddress:
                    type: string
                    maxLength: 100
                    description: '드랍 지번 주소 (`법정동`) ****필수**: dropJibunAddress 또는 dropRoadAddress*'
                  dropAddressDetail:
                    type: string
                    maxLength: 100
                    description: 드랍 상세 주소
                  dropLocation:
                    type: object
                    properties:
                      latitude:
                        type: string
                        description: 위도
                      longitude:
                        type: string
                        description: 경도 드랍지 좌표 **주소가 유효하지 않은 경우, **좌표로 처리**합니다.*
                    required:
                    - latitude
                    title: 좌표 데이터
                  pickupWishAt:
                    type: integer
                    format: int64
                    x-constraint: '[ 현재시간 .. 90분 ]'
                    description: 픽업 희망 일시 (timestamp)
                  totalPayPrice:
                    type: integer
                    x-constraint: '>= actualPayPrice'
                    description: 총 결제 금액
                  actualPayPrice:
                    type: integer
                    description: 실제 결제 금액 **(고객이 실제로 결제한 금액으로, 할인/쿠폰/포인트 등의 사유로 총 결제 금액에서 차감된 결제 금액)**
                  prepaidPrice:
                    type: integer
                    description: 선결제 금액 (= actualPayPrice)
                  hasAlcoholicBeverage:
                    type: boolean
                    description: 주류 상품 포함 여부 **주류 상품이 포함되는 경우 비대면 접수는 불가능합니다.*
                  bundleDeliveryCount:
                    type: integer
                    minimum: 1
                    maximum: 3
                    description: 묶음 배달 건수 **배달대행사 수행 라이더의 묶음 배달 건수에 대한 제한을 요청합니다.* **사전 협의 필요 필드*
                  deliveryExecutionType:
                    type: string
                    description: 자율 수행 (= "`AUTONOMY`") **일정 시간 동안 배차가 되지 않을 시 자동 취소되는 옵션입니다.* **사전 협의 필요 필드*
                  referencedOrderAgencyOrderId:
                    type: string
                    maxLength: 50
                    description: 참조 주문 제휴사 주문 아이디 **해당 참조 주문의 배달을 수행한 배달대행사가 다시 선정(배정)될 수 있도록 요구하는 옵션입니다.* (아래와 같은 제한 사항이
                      있으니, 참고하여 연동하시길 바랍니다) 1. 정상 접수되고 배차 ~ 완료된 주문만 가능 2. 배차 시점 24시간 이내의 주문만 가능 3. 예약 주문 접수 시 사용은 불가능
                required:
                - orderAgencyId
                - pickupId
                - pickupAddressDetail
                - dropAddressDetail
                - pickupWishAt
                - totalPayPrice
                - actualPayPrice
                - prepaidPrice
                - hasAlcoholicBeverage
                title: 고정 요금 | 의무 수행 (주소 기반)
                x-source-doc: https://developer.gorelas.com/api-docs-md/request-1.md
              - type: object
                properties:
                  orderAgencyId:
                    type: string
                    maxLength: 30
                    description: 주문 제휴사 아이디
                  orderAgencyStoreId:
                    type: string
                    maxLength: 100
                    description: 주문 제휴사 상점 아이디
                  dropRoadAddress:
                    type: string
                    maxLength: 100
                    description: '드랍 도로명 주소 ****필수**: dropJibunAddress 또는 dropRoadAddress*'
                  dropJibunAddress:
                    type: string
                    maxLength: 100
                    description: '드랍 지번 주소 (`법정동`) ****필수**: dropJibunAddress 또는 dropRoadAddress*'
                  dropAddressDetail:
                    type: string
                    maxLength: 100
                    description: 드랍 상세 주소
                  dropLocation:
                    type: object
                    properties:
                      latitude:
                        type: string
                        description: 위도
                      longitude:
                        type: string
                        description: 경도 드랍지 좌표 **주소가 유효하지 않은 경우, **좌표로 처리**합니다.*
                    required:
                    - latitude
                    title: 좌표 데이터
                  pickupWishAt:
                    type: integer
                    format: int64
                    x-constraint: '[ 현재시간 .. 90분 ]'
                    description: 픽업 희망 일시 (timestamp) **픽업 희망 일시 요청 시 픽업 예상 일시(pickupExpectedAt) 응답이 가능합니다.*
                  totalPayPrice:
                    type: integer
                    x-constraint: '>= actualPayPrice'
                    description: 총 결제 금액
                  actualPayPrice:
                    type: integer
                    description: 실제 결제 금액 **(고객이 실제로 결제한 금액으로, 할인/쿠폰/포인트 등의 사유로 총 결제 금액에서 차감된 결제 금액)**
                  prepaidPrice:
                    type: integer
                    description: 선결제 금액
                  paymentCashPrice:
                    type: integer
                    description: 후불 현금 결제 금액 **(라이더 현장 결제)**
                  paymentCardPrice:
                    type: integer
                    description: 후불 카드 결제 금액 **(라이더 현장 결제)**
                  bundleDeliveryCount:
                    type: integer
                    x-constraint: '[ 1 ]'
                    description: 묶음 배달 건수 **배달대행사 수행 라이더의 묶음 배달 건수에 대한 제한을 요청합니다.* **사전 협의 필요 필드*
                  deliveryExecutionType:
                    type: string
                    description: 자율 수행 (= "`AUTONOMY`") **일정 시간 동안 배차가 되지 않을 시 자동 취소되는 옵션입니다.* **후불 현금이 포함된 주문은 자율 수행이 불가능합니다.*
                      **사전 협의 필요 필드*
                  referencedOrderAgencyOrderId:
                    type: string
                    maxLength: 50
                    description: 참조 주문 제휴사 주문 아이디 **해당 참조 주문의 배달을 수행한 배달대행사가 다시 선정(배정)될 수 있도록 요구하는 옵션입니다.* (아래와 같은 제한 사항이
                      있으니, 참고하여 연동하시길 바랍니다) 1. 정상 접수되고 배차 ~ 완료된 주문만 가능 2. 배차 시점 24시간 이내의 주문만 가능 3. 예약 주문 접수 시 사용은 불가능
                required:
                - orderAgencyId
                - orderAgencyStoreId
                - dropAddressDetail
                - totalPayPrice
                - actualPayPrice
                - prepaidPrice
