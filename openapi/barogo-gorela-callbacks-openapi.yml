      - 카드 결제 내역
      x-callback-path: /delivery/payments
      x-evidence:
        method: derived-from-published-docs
        sources:
        - https://developer.gorelas.com/api-docs-md/callback-8.md
        fetched: '2026-08-06'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderAgencyId:
                  type: string
                  maxLength: 30
                  description: 주문 제휴사 아이디
                orderAgencyOrderId:
                  type: string
                  maxLength: 50
                  description: 주문 제휴사 주문 아이디
                orderAgencyStoreId:
                  type: string
                  maxLength: 100
                  description: 주문 제휴사 상점 아이디
                orderId:
                  type: integer
                  format: int64
                  description: 고릴라 주문 아이디
                payments:
                  type: array
                  items:
                    type: object
                    properties:
                      paymentMethod:
                        type: string
                        description: 결제 수단 (= CARD)
                      cardCompany:
                        type: string
                        maxLength: 30
                        description: 카드사명
                      cardNumber:
                        type: string
                        maxLength: 20
                        description: 카드 번호
                      vanCompany:
                        type: string
                        maxLength: 30
                        description: VAN사명
                      approvalNumber:
                        type: string
                        maxLength: 100
                        description: 승인 번호
                      approvalAt:
                        type: integer
                        format: int64
                        description: 승인 일시 (timestamp)
                      instalment:
                        type: integer
                        description: '할부 개월 수 (일시불: 0)'
                      charge:
                        type: integer
                        description: 결제 금액
                      isCanceled:
                        type: boolean
                        description: 결제 취소 여부 결제 목록
                    required:
                    - paymentMethod
                    - cardCompany
                    - cardNumber
                    - vanCompany
                    - approvalNumber
                    - approvalAt
                    - instalment
                    - charge
                    - isCanceled
                    title: 결제 데이터
              required:
              - orderAgencyId
              - orderAgencyOrderId
              - orderAgencyStoreId
              - orderId
            examples:
              Request:
                value:
                  orderAgencyId: gorela_chicken
                  orderAgencyOrderId: TEST_00000123
                  orderAgencyStoreId: gorela_chicken_store_1
                  orderId: 230127171824940
                  payments:
                  - paymentMethod: CARD
                    cardCompany: 신한카드
                    cardNumber: 1111********2222
                    vanCompany: ABC-VAN
                    approvalNumber: 12345-12-147
                    approvalAt: 1674810824156
                    instalment: 0
                    charge: 30000
                    isCanceled: false
                  - paymentMethod: CARD
                    cardCompany: KB국민카드
                    cardNumber: 1234********5678
                    vanCompany: ABC-VAN
                    approvalNumber: 12345-12-133
                    approvalAt: 1674810690156
                    instalment: 0
                    charge: 30000
                    isCanceled: true
                  - paymentMethod: CARD
                    cardCompany: KB국민카드
                    cardNumber: 1234********5678
                    vanCompany: ABC-VAN
                    approvalNumber: 12345-12-133
                    approvalAt: 1674810643156
                    instalment: 0
                    charge: 30000
                    isCanceled: false
      responses:
        '200':
          description: 콜백 수신 성공. 응답은 최대 3초까지만 대기하며, 타임아웃 시 2초 / 18초 / 50초 간격으로 총 3회 재시도합니다.
        '404':
          description: 연동하지 않은 콜백. 주문 제휴사는 미연동 콜백에 404로 응답합니다.
