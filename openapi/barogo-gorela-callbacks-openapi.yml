openapi: 3.1.0
info:
  title: Barogo Gorela Callback (Webhook) API
  version: '2026-06-23'
  summary: 고릴라 → 주문 제휴사 콜백(웹훅) 규격
  description: 'The 20 callbacks Gorela POSTs to an order agency''s own endpoints as an order and its child deliveries progress.
    Gorela sends EVERY callback it generates regardless of which ones a partner has implemented; unimplemented callbacks must
    answer 404.


    Delivery semantics (published in the common reference): the receiving endpoint has 3 seconds to respond; on timeout Gorela
    retries 3 times at 2s / 18s / 50s. Timestamps are GMT+00:00 milliseconds, distances are metres, coordinates are WGS84
    to >= 6 decimal places.


    DERIVED by API Evangelist from https://developer.gorelas.com/api-docs-md/ — verbatim paths, payload fields, types and
    examples. Barogo publishes no AsyncAPI or OpenAPI of its own.'
  contact:
    name: Gorela TAM
    email: tech_poc@barogo.com
    url: https://developer.gorelas.com/
  x-origin:
  - format: markdown
    url: https://developer.gorelas.com/api-docs-md/index.md
    version: '2026-06-23'
    converter:
      url: https://apievangelist.com
      version: pipeline-enrich local-v1
webhooks:
  onDeliveryAccepted:
    post:
      operationId: onDeliveryAccepted
      summary: 배달 접수
      description: 고릴라 → 주문 제휴사 콜백. 주문 제휴사가 구현한 콜백 베이스 URL에 `POST /delivery/accepted` 로 전달됩니다. 연동하지 않은 콜백은 404(Not Found)로
        응답해야 합니다.
      tags:
      - 배달 접수
      x-callback-path: /delivery/accepted
      x-evidence:
        method: derived-from-published-docs
        sources:
        - https://developer.gorelas.com/api-docs-md/callback-4.md
        fetched: '2026-08-06'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderAgencyId:
                  type: string
                  maxLength: 30
                  description: 주문 제휴사 아이디
                orderAgencyOrderId:
                  type: string
                  maxLength: 50
                  description: 주문 제휴사 주문 아이디
                orderAgencyStoreId:
                  type: string
                  maxLength: 100
                  description: 주문 제휴사 상점 아이디
                orderId:
                  type: integer
                  format: int64
                  description: 고릴라 주문 아이디
                deliveryAgencyId:
                  type: string
                  maxLength: 30
                  description: 배달대행사 아이디
                pickupExpectedAt:
                  type: integer
                  description: 픽업 예상 일시 (timestamp) *(현장 상황에 따라 ±10분 오차가 있을 수 있습니다)*
                changedAt:
                  type: integer
                  format: int64
                  description: 배달 상태 변경 일시 (timestamp)
              required:
              - orderAgencyId
              - orderAgencyOrderId
              - orderAgencyStoreId
              - orderId
              - deliveryAgencyId
              - pickupExpectedAt
              - changedAt
            examples:
              Request:
                value:
                  orderAgencyId: gorela_chicken
                  orderAgencyOrderId: TEST_00000123
                  orderAgencyStoreId: gorela_chicken_store_1
                  orderId: 230127171824940
                  deliveryAgencyId: barogo
                  pickupExpectedAt: 1674808200248
                  changedAt: 1674807600884
      responses:
        '200':
          description: 콜백 수신 성공. 응답은 최대 3초까지만 대기하며, 타임아웃 시 2초 / 18초 / 50초 간격으로 총 3회 재시도합니다.
        '404':
          description: 연동하지 않은 콜백. 주문 제휴사는 미연동 콜백에 404로 응답합니다.
  onDeliveryCardPayments:
