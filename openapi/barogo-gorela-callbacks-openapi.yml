                  - CHANGE_DISTANCE
                  - CHANGE_EXTRA_CHARGE
                  - ETC
                  x-enum-descriptions:
                    OVERLOAD: 과적으로 인하여 변경된 경우
                    CHANGE_DISTANCE: 배달 거리가 변경된 경우
                    CHANGE_EXTRA_CHARGE: 할증이 변경된 경우
                    ETC: 기타 사유로 인해 변경된 경우
                changedAt:
                  type: integer
                  format: int64
                  description: 배달 요금 변경 일시 (timestamp)
                totalDeliveriesPrice:
