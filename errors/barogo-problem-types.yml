  - status: 400
    category: BAD_REQUEST
    code: NONE_DELIVERY_AGENCY_MAPPING
    title: 배달대행사 매핑이 존재하지 않거나 매핑 상태가 모두 중지인 경우
    remediation: Complete store mapping (createStoreMapping) before submitting orders for that store.
  - status: 400
