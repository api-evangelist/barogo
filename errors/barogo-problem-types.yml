format: custom-envelope
note: >-
  Gorela does not use RFC 9457 application/problem+json. It publishes a single custom error
  envelope with a three-part identity — HTTP statusCode, an errorCategory, and a stable
  errorCode string. The table below is the provider's own published registry, transcribed
  verbatim from the common API reference. Success responses carry the same envelope shape
  with a data payload instead of an error object.
envelope:
  success:
    shape: '{ "statusCode": <int>, "data": { ... } }'
    partial_success: '{ "statusCode": 207, "data": [ ... ], "errors": [ { "category", "errorCode", "message", "info" } ] }'
    status_codes:
      - status: 200
        description: 요청한 작업이 성공했을 때 응답됩니다.
      - status: 201
        description: 데이터 생성에 성공했을 때 응답됩니다.
      - status: 204
        description: 데이터 삭제에 성공했을 때 응답됩니다.
      - status: 207
        description: 요청한 작업이 일부만 성공했을 때 응답됩니다.
  error:
    shape: '{ "statusCode": <int>, "error": { "category": <errorCategory>, "errorCode": <errorCode>, "message": <string> } }'
    fields:
      - field: statusCode
        description: HTTP status code for the request outcome.
      - field: error.category
        description: Error category (errorCategory) — the coarse class of failure.
      - field: error.errorCode
        description: Stable machine-readable error code. This is the field to branch on.
      - field: error.message
        description: Human-readable detail, e.g. "should have required property 'orderAgencyId'".
    example: |-
      {
        "statusCode": 400,
        "error": {
          "category": "BAD_REQUEST",
          "errorCode": "SCHEMA_VALIDATE",
          "message": "should have required property 'orderAgencyId'"
        }
      }
problems:
  - status: 400
    category: BAD_REQUEST
    code: SCHEMA_VALIDATE
    title: 요청 데이터의 검증에 통과하지 못한 경우
    remediation: Validate the request body against the operation schema before sending; the message names the failing property.
  - status: 400
