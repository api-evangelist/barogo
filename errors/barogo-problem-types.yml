  - status: 404
    category: NOT_FOUND
    code: EXTERNAL_NOT_FOUND_RESOURCE
    title: 배달대행사에 해당 리소스(데이터)가 존재하지 않는 경우
    note: Failure originates downstream at the delivery agency, not at Gorela.
  - status: 409
    category: CONFLICT
    code: DUPLICATED_ID
    title: 생성하려는 데이터의 아이디가 이미 존재하는 경우
    note: >-
      This is the closest thing Gorela publishes to a duplicate-submission guard — a repeat
      createOrder with the same orderAgencyOrderId conflicts rather than replaying. It is
      duplicate rejection, not idempotent replay; no Idempotency-Key header is documented.
  - status: 409
