rejection_reasons:
  note: >-
    Several operations answer HTTP 200 with `data.isSuccess: false` and a `reason` enum
    rather than an HTTP error. These are business rejections, not transport errors — an
    integrating client must branch on isSuccess, not on the status code alone.
